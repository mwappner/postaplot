name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            minimum-dependencies: true
          - python-version: "3.14"
            minimum-dependencies: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum dependencies
        if: matrix.minimum-dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.23.5 scipy==1.9.3 matplotlib==3.10.0 pandas==1.5.3
          python -m pip install --no-deps .
          python -m pip install pytest
      - name: Install current dependencies
        if: ${{ !matrix.minimum-dependencies }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest
      - name: Smoke-test documentation
        env:
          MPLBACKEND: Agg
        run: python scripts/check_docs.py
      - name: Regenerate documentation figures
        env:
          MPLBACKEND: Agg
        run: |
          python scripts/generate_figures.py
          python scripts/check_docs.py
