name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"Release tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          PY
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest build twine
      - name: Test and check documentation
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest
          python scripts/check_docs.py
          python scripts/generate_figures.py
          python scripts/check_docs.py
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/postaplot-wheel
          /tmp/postaplot-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          MPLBACKEND=Agg /tmp/postaplot-wheel/bin/python - <<'PY'
          import matplotlib.pyplot as plt
          from postaplot import postaplot

          artists = postaplot(x=["a", "a", "b", "b"], y=[1, 2, 2, 3], box=True, seed=1)
          assert artists
          plt.close("all")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/postaplot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
