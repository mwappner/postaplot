[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "postaplot"
version = "0.1.2"
description = "Kernel-density based scatter plots with seaborn-like API."
authors = [
    { name = "mwappner" }
]
readme = "docs/README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.9.3",
    "matplotlib>=3.10",
    "pandas>=1.5.3",
]

[project.urls]
Homepage = "https://github.com/mwappner/postaplot"
Issues = "https://github.com/mwappner/postaplot/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["postaplot"]

[tool.setuptools]
package-dir = {"" = "."}

